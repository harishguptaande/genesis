name: "Copilot Setup Steps - SAP Development"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install SAP development tools
        run: |
          pip install \
            abap-sdk \
            sap-connector \
            py-abap \
            odata4py

      - name: Verify installations
        run: |
          python -c "import abap_sdk; print(f'ABAP SDK version: {abap_sdk.__version__}')"
          pip list | grep -E "abap|sap"
